<!-- https://angular.dev/guide/forms/template-driven-forms -->

<p>{{ spende | json }}</p>

<div class="form-check">
  <input class="form-check-input" type="radio" name="uebergabe" [value]="true" id="uebergabe1" [(ngModel)]="spende.uebergabe">
  <label class="form-check-label" for="uebergabe1">
    Ich bringe die Spende an die Geschäftsstelle.
  </label>
</div>

<div class="form-check">
  <input class="form-check-input" type="radio" name="uebergabe" [value]="false" id="uebergabe2" [(ngModel)]="spende.uebergabe">
  <label class="form-check-label" for="uebergabe2">
    Ich wohne innerhalb des Radius* und möchte, dass meine Spende abgeholt wird.
  </label>
</div>

<p>*wir bieten eine Abholung nur innerhalb der Stadt Thun an sowie an allen umliegenden Orten, bei denen die Postleitzahl mit 36 beginnt (z.B. 3600). Für Ihr Verständnis bedanken wir uns. </p>
